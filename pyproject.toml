[project]
name = "pyro-visibility-analysis"
version = "0.1.0"
description = "Coverage and visibility-zone analysis for Pyronear camera sites, with GDAL and Python (QGIS or a standalone HTML page for visualisation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "geopandas",
    "rioxarray",
    "shapely",
    "numpy",
    "openpyxl",
    "pillow",
    "rasterio",
    "elevation",
]

[tool.uv]
package = false
